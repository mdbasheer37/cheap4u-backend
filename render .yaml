services:
  - type: web
    name: cheap4u-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: cheap4u-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: TERMII_API_KEY
        value: TLmOQIYHvwkjuJBhrEShfyjuyQzurtvWXwXeSoeUseuiWRLwHHpqjWnfHpZUWn
      - key: TERMII_SENDER_ID
        value: Cheap4uApp
      - key: BACKEND_URL
        value: https://cheap4u-backend.onrender.com

databases:
  - name: cheap4u-db
    plan: free
