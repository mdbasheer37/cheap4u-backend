
services:
  - type: web
    name: cheap4u-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cheap4u-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.0

databases:
  - name: cheap4u-db
    plan: free
