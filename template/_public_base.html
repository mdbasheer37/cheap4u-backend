<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
  <title>{% block title %}Cheap4U{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', filename='img/logo.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/public.css') }}">
</head>
<body>

  <header class="page-header">
    <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Cheap4U logo">
    <p class="brand-name">Cheap4U</p>
    <p class="brand-tag">Fast &bull; Secure &bull; Reliable</p>
  </header>

  <div class="container">
    {% block content %}{% endblock %}
  </div>

  <footer class="site-footer">
    <div>Cheap4U &copy; 2026</div>
    <div class="footer-links">
      <a href="{{ url_for('public_pages.privacy_policy_page') }}">Privacy Policy</a>
      <a href="mailto:{{ support_email }}">Support Email</a>
      <a href="{{ url_for('public_pages.terms_of_service_page') }}">Terms of Service</a>
    </div>
  </footer>

</body>
</html>
