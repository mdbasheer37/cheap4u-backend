{% extends "_public_base.html" %}

{% block title %}Terms of Service — Cheap4U{% endblock %}

{% block content %}
  <div class="card legal-body">
    <h1>Terms of Service</h1>
    <span class="legal-updated">Last updated: July 2026</span>
    {% for para in sections %}
      {% if para.heading %}
        <h2>{{ para.heading }}</h2>
      {% endif %}
      <p>{{ para.text }}</p>
    {% endfor %}
  </div>
{% endblock %}
